<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="style.css"
      type="text/css"
      media="screen"
      charset="utf-8"
    />
  </head>
  <body>
    <div class="matrix">
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower matrix" /><a
        class="matrix_link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details&quest;</a
      >
    </div>
    <main class="todo_app">
      <p>
        <label class="add_task_label" for="new_task_input">Add Item</label>
      </p>
      <div class="new_task_row">
        <input id="new_task_input" class="new_task_input" type="text" /><button
          id="add_task_button"
          type="button"
        >
          Add
        </button>
      </div>
      <p></p>
      <h3>Todo</h3>
      <ul id="todo_list" class="task_list">
        <li class="task">
          <input class="task_checkbox" type="checkbox" /><label
            class="task_label"
            >Pay Bills</label
          ><input class="task_edit_input" type="text" /><button
            class="task_edit_button"
            type="button"
          >
            Edit</button
          ><button class="task_delete_button" type="button">
            <img src="./remove.svg" alt="" />
          </button>
        </li>
        <li class="task task_editing">
          <input class="task_checkbox" type="checkbox" /><label
            class="task_label"
            >Go Shopping</label
          ><input
            class="task_edit_input"
            type="text"
            value="Go Shopping"
          /><button class="task_edit_button" type="button">Save</button
          ><button class="task_delete_button" type="button">
            <img src="./remove.svg" alt="" />
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed_list" class="task_list">
        <li class="task">
          <input class="task_checkbox" type="checkbox" checked /><label
            class="task_label"
            >See the Doctor</label
          ><input class="task_edit_input" type="text" /><button
            class="task_edit_button"
            type="button"
          >
            Edit</button
          ><button class="task_delete_button" type="button">
            <img src="./remove.svg" alt="" />
          </button>
        </li>
      </ul>
    </main>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
