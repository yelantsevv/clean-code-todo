<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" type="text/css" />
  </head>
  <body>
    <header class="header">
      <img class="header__image" src="./eisenhower-matrix.jpg" />
      <a
        class="header__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details?</a
      >
    </header>
    <main class="app">
      <p id="topSectionForAddingElementToList">
        <label class="task-form__label" for="new-task">Add Item</label>
      </p>
      <div class="task-form">
        <input id="new-task" class="task-form__input" type="text" /><button>
          Add
        </button>
      </div>
      <h3 class="app__heading">Todo</h3>
      <ul class="task-list" id="incompleteTasks">
        <li class="task">
          <input type="checkbox" /><label class="task__label">Pay Bills</label
          ><input type="text" class="task__input" /><button class="task__edit">
            Edit</button
          ><button class="task__delete"><img src="./remove.svg" /></button>
        </li>
        <li class="task task--editing">
          <input type="checkbox" /><label class="task__label">Go Shopping</label
          ><input type="text" value="Go Shopping" class="task__input" /><button
            class="task__edit"
          >
            Save</button
          ><button class="task__delete"><img src="./remove.svg" /></button>
        </li>
      </ul>
      <h3 class="app__heading">Completed</h3>
      <ul class="task-list task-list--completed" id="completed-tasks">
        <li class="task">
          <input type="checkbox" checked /><label class="task__label"
            >See the Doctor</label
          ><input type="text" class="task__input" /><button class="task__edit">
            Edit</button
          ><button class="task__delete"><img src="./remove.svg" /></button>
        </li>
      </ul>
    </main>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
