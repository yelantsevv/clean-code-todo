<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <img
        class="header__image"
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower matrix"
      />
      <a
        class="header__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details?</a
      >
    </header>
    <main class="app">
      <p>
        <label class="task-form__label" for="new-task">Add Item</label>
      </p>
      <div class="task-form">
        <input id="new-task" class="task-form__input" type="text" />
        <button type="button">Add</button>
      </div>
      <h2 class="app__heading">Todo</h2>
      <ul class="task-list" id="incompleteTasks">
        <li class="task">
          <input type="checkbox" aria-label="Toggle task completion" />
          <label class="task__label">Pay Bills</label>
          <input type="text" class="task__input" aria-label="Edit task" />
          <button class="task__edit" type="button">Edit</button>
          <button class="task__delete" type="button" aria-label="Delete task">
            <img src="./remove.svg" alt="" />
          </button>
        </li>
        <li class="task task--editing">
          <input type="checkbox" aria-label="Toggle task completion" />
          <label class="task__label">Go Shopping</label>
          <input
            type="text"
            value="Go Shopping"
            class="task__input"
            aria-label="Edit task"
          />
          <button class="task__edit" type="button">Save</button>
          <button class="task__delete" type="button" aria-label="Delete task">
            <img src="./remove.svg" alt="" />
          </button>
        </li>
      </ul>
      <h2 class="app__heading">Completed</h2>
      <ul class="task-list task-list--completed" id="completed-tasks">
        <li class="task">
          <input type="checkbox" checked aria-label="Toggle task completion" />
          <label class="task__label">See the Doctor</label>
          <input type="text" class="task__input" aria-label="Edit task" />
          <button class="task__edit" type="button">Edit</button>
          <button class="task__delete" type="button" aria-label="Delete task">
            <img src="./remove.svg" alt="" />
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
